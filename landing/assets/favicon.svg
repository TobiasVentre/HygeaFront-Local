<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Hygea Go">
  <!--
    Isotipo Hygea: casa con gota calada en negativo, el mismo que usa la app.
    Aca va en azul corporativo (#004aad) para la landing institucional.
  -->
  <defs>
    <clipPath id="hygeaRound"><rect width="100" height="100" rx="22"/></clipPath>
    <mask id="hygeaCasa">
      <path d="M50 14 88 46v30a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V46z" fill="#fff"/>
      <path d="M50 40c0 0 11 12.4 11 19.4a11 11 0 0 1-22 0C39 52.4 50 40 50 40z" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#hygeaRound)">
    <rect width="100" height="100" fill="#004aad"/>
    <rect width="100" height="100" fill="#fff" mask="url(#hygeaCasa)"/>
  </g>
</svg>
